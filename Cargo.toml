[workspace]
resolver = "3"
members = ["wasmachine", "wasmachine-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Guest modules built against this core ship as release builds; panic=abort
# matches the guest ABI (a panic routes through the SDK hook to host `fail`,
# then traps).
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
